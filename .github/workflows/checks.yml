name: Local checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r lab/requirements.txt
      - run: npm test
      - run: npm run test:lab
      - run: npm run build
  emulator-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r lab/requirements.txt
      - name: Install local emulator
        run: |
          curl -fsSLo /tmp/emulator.deb https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/aws-emulator_1.0.385-1_amd64.deb
          sudo apt-get install -y /tmp/emulator.deb
      - name: Check S3 API round trip locally
        run: |
          aws-emulator -t off --idle-timeout 120 > /tmp/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          python lab/wait_ready.py
          python lab/smoke.py
